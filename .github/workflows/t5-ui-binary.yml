name: MeshInk build and release

on:
  push:
    branches: [main, feature/quick-settings-swipe]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: meshink-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: meshink-pio-${{ runner.os }}-
      - run: python -m pip install platformio Pillow
      - name: Validate all radio presets
        run: python tools/check_radio_presets.py
      - name: Host map archive reader tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/pmtiles_stubs -Isrc \
            '-DMESHINK_STORAGE_BACKEND_HEADER="storage_backend.h"' \
            src/pmtiles_reader.cpp tests/test_pmtiles_reader.cpp \
            -lz -o /tmp/map-archive-test
          /tmp/map-archive-test
      - name: Maps-only gesture geometry regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/test_map_gestures.cpp -o /tmp/map-gestures-test
          /tmp/map-gestures-test
      - name: Shared UI drawing and touch geometry regression
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc \
            tests/test_ui_layout.cpp -o /tmp/ui-layout-test
          /tmp/ui-layout-test
      - name: Map grayscale equivalence regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/test_map_gray.cpp -o /tmp/map-gray-test
          /tmp/map-gray-test
      - name: T5 packed framebuffer fill regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/test_t5_packed_framebuffer.cpp -o /tmp/t5-packed-fb-test
          /tmp/t5-packed-fb-test
      - name: Check UI interaction regressions
        run: python tools/check_ui_regressions.py
      - name: Verify portrait and landscape keyboard hitboxes
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tools/test_keyboard_geometry.cpp -o /tmp/meshink-keyboard-test
          /tmp/meshink-keyboard-test
      - name: Board-independent touch backend contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests -Isrc \
            tests/test_touch_contract.cpp -o /tmp/meshink-touch-contract-test
          /tmp/meshink-touch-contract-test
      - name: Board-independent GPS backend contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests -Isrc \
            tests/test_gps_contract.cpp -o /tmp/meshink-gps-contract-test
          /tmp/meshink-gps-contract-test
      - name: T5 GT911 backend state regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMESHINK_TOUCH_DIAGNOSTICS=1 \
            -Itests/touch_backend_stubs -Isrc \
            tests/test_t5_touch_backend.cpp -o /tmp/meshink-t5-touch-backend-test
          /tmp/meshink-t5-touch-backend-test
      - name: Build field-tested cache64 firmware
        run: python -m platformio run -e t5-unified-cache64

      - name: Verify cache64 release SDK config
        run: |
          test -f .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE 64' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_ESP32S3_DATA_CACHE_LINE_64B 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_BT_BLUEDROID_ENABLED 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_SPIRAM_MODE_OCT 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_FATFS_USE_FASTSEEK 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_BOOTLOADER_LOG_LEVEL_WARN 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_BOOTLOADER_LOG_LEVEL 2' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_LOG_DEFAULT_LEVEL_WARN 1' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_LOG_DEFAULT_LEVEL 2' .pio/build/t5-unified-cache64/config/sdkconfig.h
          grep -q '#define CONFIG_LOG_MAXIMUM_LEVEL 2' .pio/build/t5-unified-cache64/config/sdkconfig.h
          ! grep -q '#define CONFIG_LOG_DEFAULT_LEVEL_INFO 1' .pio/build/t5-unified-cache64/config/sdkconfig.h

      - name: Read firmware version
        id: version
        run: |
          python - <<'PY'
          import configparser
          import os
          import re
          config = configparser.ConfigParser(interpolation=None)
          if not config.read("platformio.ini"):
              raise SystemExit("platformio.ini not found")
          flags = config["env:t5-unified"]["build_flags"]
          match = re.search(r"""-DT5_FIRMWARE_VERSION='"(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)"'""", flags)
          if not match:
              raise SystemExit("Unified firmware version is missing or invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={match.group(1)}\n")
          PY

      - name: Verify release tag matches firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match firmware version v$VERSION"
            exit 1
          }

      - name: Package update image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD=".pio/build/t5-unified-cache64"
          test -s "$BUILD/firmware.bin"
          cp "$BUILD/firmware.bin" "meshink-$VERSION-update.bin"
          grep -aFq "$VERSION" "meshink-$VERSION-update.bin"
          sha256sum "meshink-$VERSION-update.bin" > SHA256SUMS.txt
          cp src/fonts/INTER_LICENSE.txt INTER_LICENSE.txt

      - name: Package release full-wipe image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD=".pio/build/t5-unified-cache64"
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$FRAMEWORK/tools/partitions/boot_app0.bin"
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            --flash_mode keep --flash_freq keep --flash_size 16MB \
            --fill-flash-size 16MB \
            -o "meshink-$VERSION-full-wipe.bin" \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            0x10000 "$BUILD/firmware.bin"
          test -s "meshink-$VERSION-full-wipe.bin"
          test "$(stat -c%s "meshink-$VERSION-full-wipe.bin")" -eq 16777216
          sha256sum "meshink-$VERSION-full-wipe.bin" >> SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meshink-${{ steps.version.outputs.version }}
          path: |
            meshink-*-update.bin
            meshink-*-full-wipe.bin
            SHA256SUMS.txt
            INTER_LICENSE.txt

      # An explicit release commit can publish directly after a successful main
      # build. gh release create makes the matching tag at GITHUB_SHA; a tag
      # created by GITHUB_TOKEN does not spawn another workflow run.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          test "${GITHUB_REF_TYPE}" != "tag" || test "${GITHUB_REF_NAME}" = "${TAG}"
          cat > release-notes.md <<EOF
          ## MeshInk $VERSION

          **meshink-$VERSION-update.bin** — for a device already running MeshInk. It updates the application without intentionally wiping the rest of flash.

          **meshink-$VERSION-full-wipe.bin** — for a new installation or clean reinstall. It is a 16 MB full-flash image; writing it at 0x0 overwrites the complete flash, including previous settings and stored data.

          See the README for Windows, macOS and Linux flashing instructions.

          SHA-256 checksums are in **SHA256SUMS.txt**.

          MeshInk $VERSION promotes the field-tested 1.9.3-test.11 firmware
          to the stable release channel.

          Highlights:
          - RAM-first message journal access with lazy history paging, eliminating
            runtime SPIFFS reads while keeping persisted messages durable
          - substantially faster e-paper UI composition through packed framebuffer
            rectangle and rounded-fill acceleration
          - direct-message retry progress stays RAM-only until the final outcome,
            while the UI reports MeshCore's actual direct/flood route
          - 80 MHz interactive cruise with targeted 240 MHz render/storage bursts
            for lower active power without sacrificing responsiveness
          - 240 MHz race-to-idle startup, reused GPS detection and overlapped SPIFFS
            mounting for substantially faster boot while preserving LilyGO's
            required LoRa/GPS rail settling time
          - Maps remain warmed during startup, with faster 240 MHz preparation
          - larger satellites-in-use status text matching clock and battery sizing
          - expanded timing, storage and UI performance diagnostics and regressions

          The update image does not intentionally erase existing MeshCore
          settings, contacts, current-format message history, saved Maps data,
          or saved MeshInk credentials.

          Inter font raster data is distributed under the SIL Open Font License
          included as INTER_LICENSE.txt.
          EOF
          gh release create "$TAG" \
            "meshink-$VERSION-update.bin" \
            "meshink-$VERSION-full-wipe.bin" \
            SHA256SUMS.txt \
            INTER_LICENSE.txt \
            --target "$GITHUB_SHA" \
            --title "MeshInk $VERSION" \
            --notes-file release-notes.md
