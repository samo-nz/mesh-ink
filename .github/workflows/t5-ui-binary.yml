# Builds the single-file quick-update image for each firmware milestone.
name: T5 Pro unified firmware alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: t5-ui-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: t5-ui-pio-${{ runner.os }}-
      - run: python -m pip install platformio
      - run: python -m platformio run -e t5-unified
      - name: Read unified firmware version
        id: version
        run: |
          python - <<'PY'
          import configparser
          import os
          import re

          config = configparser.ConfigParser(interpolation=None)
          if not config.read("platformio.ini"):
              raise SystemExit("platformio.ini not found")
          flags = config["env:t5-unified"]["build_flags"]
          match = re.search(r"""-DT5_FIRMWARE_VERSION='"(\d+\.\d+\.\d+)"'""", flags)
          if not match:
              raise SystemExit("Unified firmware version is missing or invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={match.group(1)}\n")
          PY
      - name: Package quick update
        env:
          T5_FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -s .pio/build/t5-unified/firmware.bin
          cp .pio/build/t5-unified/firmware.bin "t5-pro-${T5_FIRMWARE_VERSION}.bin"
          sha256sum "t5-pro-${T5_FIRMWARE_VERSION}.bin" > "t5-pro-${T5_FIRMWARE_VERSION}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-${{ steps.version.outputs.version }}
          path: |
            t5-pro-*.bin
            t5-pro-*.sha256
