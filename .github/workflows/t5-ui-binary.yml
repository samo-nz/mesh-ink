name: T5 Pro UI onboarding alpha

env:
  T5_FIRMWARE_VERSION: 0.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: t5-ui-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: t5-ui-pio-${{ runner.os }}-
      - run: python -m pip install platformio
      - run: python -m platformio run -e t5-ui-onboarding
      - name: Package quick update
        run: |
          test -s .pio/build/t5-ui-onboarding/firmware.bin
          cp .pio/build/t5-ui-onboarding/firmware.bin "t5-pro-ui-${T5_FIRMWARE_VERSION}.bin"
          sha256sum "t5-pro-ui-${T5_FIRMWARE_VERSION}.bin" > "t5-pro-ui-${T5_FIRMWARE_VERSION}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-ui-${{ env.T5_FIRMWARE_VERSION }}
          path: |
            t5-pro-ui-*.bin
            t5-pro-ui-*.sha256
