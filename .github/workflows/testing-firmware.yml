name: MeshInk testing firmware

on:
  pull_request:
    paths:
      - 'src/pmtiles_reader.*'
      - 'src/map_tiles.cpp'
      - 'src/ui_onboarding.cpp'
      - 'src/ui_data.h'
      - 'src/local_mesh_runtime.cpp'
      - 'src/map_gestures.h'
      - 'tests/test_map_gestures.cpp'
      - 'platformio.ini'
      - 'tools/check_ui_regressions.py'
      - 'src/t5_timing.*'
      - 'src/unified_main.cpp'
      - '.github/workflows/testing-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshink-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio Pillow
      - name: Host map archive reader tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/pmtiles_stubs -Isrc \
            src/pmtiles_reader.cpp tests/test_pmtiles_reader.cpp \
            -lz -o /tmp/map-archive-test
          /tmp/map-archive-test
      - name: Maps-only gesture geometry regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/test_map_gestures.cpp -o /tmp/map-gestures-test
          /tmp/map-gestures-test
      - name: UI interaction regression checks
        run: python tools/check_ui_regressions.py
      - run: python -m platformio run -e t5-unified
      - name: Prepare test update firmware
        run: |
          test -s .pio/build/t5-unified/firmware.bin
          cp .pio/build/t5-unified/firmware.bin meshink-testing-update.bin
          sha256sum meshink-testing-update.bin > meshink-testing-SHA256.txt
      - name: Downloadable testing firmware
        uses: actions/upload-artifact@v4
        with:
          name: meshink-testing-firmware
          path: |
            meshink-testing-update.bin
            meshink-testing-SHA256.txt
          if-no-files-found: error
          retention-days: 14
