name: Cleanup accidental test release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-test-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete accidental test release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.9.1-test.46 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
