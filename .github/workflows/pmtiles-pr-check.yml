name: PMTiles map build check

on:
  pull_request:
    paths:
      - 'src/pmtiles_reader.*'
      - 'src/map_tiles.cpp'
      - 'platformio.ini'
      - '.github/workflows/pmtiles-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio Pillow
      - run: python -m platformio run -e t5-unified
