name: One-time cleanup of old MeshInk testing artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-test-artifacts.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test firmware artifacts older than 48 hours
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoffMs = Date.now() - 48 * 60 * 60 * 1000;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            console.log(`Found ${artifacts.length} artifacts in ${owner}/${repo}.`);
            const oldArtifacts = artifacts.filter(a =>
              !a.expired &&
              a.workflow_run?.id &&
              Date.parse(a.created_at) < cutoffMs
            );
            const runPaths = new Map();
            let deleted = 0;
            let bytes = 0;
            let skipped = 0;
            for (const artifact of oldArtifacts) {
              const runId = artifact.workflow_run.id;
              let workflowPath = runPaths.get(runId);
              if (workflowPath === undefined) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: runId
                });
                workflowPath = run.path;
                runPaths.set(runId, workflowPath);
              }
              if (workflowPath !== '.github/workflows/testing-firmware.yml') {
                skipped++;
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              deleted++;
              bytes += artifact.size_in_bytes || 0;
              console.log(`Deleted artifact ${artifact.id}: ${artifact.name} (${artifact.size_in_bytes} bytes)`);
            }
            console.log(`CLEANUP RESULT: deleted=${deleted}; bytes=${bytes}; skipped_other_workflows=${skipped}; total_listed=${artifacts.length}`);
