name: T5 Pro BLE companion alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: t5-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: t5-pio-${{ runner.os }}-
      - run: python -m pip install platformio
      - run: python -m platformio run -e t5-companion
      - name: Verify binary
        run: |
          test -s .pio/build/t5-companion/firmware.bin
          cp .pio/build/t5-companion/firmware.bin t5-pro-companion-alpha.bin
          sha256sum t5-pro-companion-alpha.bin > t5-pro-companion-alpha.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-companion-alpha
          path: |
            t5-pro-companion-alpha.bin
            t5-pro-companion-alpha.sha256
