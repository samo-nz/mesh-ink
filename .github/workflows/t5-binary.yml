name: T5 Pro BLE companion alpha

env:
  T5_FIRMWARE_VERSION: 0.9.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: t5-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: t5-pio-${{ runner.os }}-
      - run: python -m pip install platformio
      - run: python -m platformio run -e t5-companion
      - name: Verify binary
        run: |
          test -s .pio/build/t5-companion/firmware.bin
          test -s .pio/build/t5-companion/bootloader.bin
          test -s .pio/build/t5-companion/partitions.bin
          test -s ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          cp .pio/build/t5-companion/firmware.bin "t5-pro-companion-${T5_FIRMWARE_VERSION}.bin"
          cp .pio/build/t5-companion/bootloader.bin bootloader.bin
          cp .pio/build/t5-companion/partitions.bin partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin boot_app0.bin
          sha256sum "t5-pro-companion-${T5_FIRMWARE_VERSION}.bin" bootloader.bin partitions.bin boot_app0.bin > "t5-pro-companion-${T5_FIRMWARE_VERSION}.sha256"
      - name: Merge images with 16MB flash header
        run: |
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            --flash_mode keep --flash_freq 80m --flash_size 16MB \
            -o "t5-pro-companion-${T5_FIRMWARE_VERSION}-complete.bin" \
            0x0 bootloader.bin \
            0x8000 partitions.bin \
            0xe000 boot_app0.bin \
            0x10000 "t5-pro-companion-${T5_FIRMWARE_VERSION}.bin"
          test -s "t5-pro-companion-${T5_FIRMWARE_VERSION}-complete.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-companion-${{ env.T5_FIRMWARE_VERSION }}
          path: |
            t5-pro-companion-*.bin
            t5-pro-companion-*.sha256
            bootloader.bin
            partitions.bin
            boot_app0.bin
