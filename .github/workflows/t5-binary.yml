name: T5 Pro BLE companion alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
            .pio
          key: t5-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: t5-pio-${{ runner.os }}-
      - run: python -m pip install platformio
      - run: python -m platformio run -e t5-companion
      - run: python -m platformio run -e t5-diagnostic
      - name: Verify binary
        run: |
          test -s .pio/build/t5-companion/firmware.bin
          test -s .pio/build/t5-diagnostic/firmware.bin
          test -s .pio/build/t5-companion/bootloader.bin
          test -s .pio/build/t5-companion/partitions.bin
          test -s ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          cp .pio/build/t5-companion/firmware.bin t5-pro-companion-alpha.bin
          cp .pio/build/t5-diagnostic/firmware.bin t5-pro-boot-diagnostic.bin
          cp .pio/build/t5-diagnostic/bootloader.bin t5-pro-boot-bootloader.bin
          cp .pio/build/t5-diagnostic/partitions.bin t5-pro-boot-partitions.bin
          cp .pio/build/t5-companion/bootloader.bin bootloader.bin
          cp .pio/build/t5-companion/partitions.bin partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin boot_app0.bin
          sha256sum t5-pro-companion-alpha.bin bootloader.bin partitions.bin boot_app0.bin > t5-pro-companion-alpha.sha256
          sha256sum t5-pro-boot-diagnostic.bin t5-pro-boot-bootloader.bin t5-pro-boot-partitions.bin boot_app0.bin > t5-pro-boot-diagnostic.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-companion-alpha
          path: |
            t5-pro-companion-alpha.bin
            t5-pro-companion-alpha.sha256
            bootloader.bin
            partitions.bin
            boot_app0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: t5-pro-boot-diagnostic
          path: |
            t5-pro-boot-diagnostic.bin
            t5-pro-boot-bootloader.bin
            t5-pro-boot-partitions.bin
            boot_app0.bin
            t5-pro-boot-diagnostic.sha256
