name: One-time cleanup of regular MeshInk build artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cleanup-regular-firmware.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve published releases and delete old build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const requiredReleaseTags = ['v3.0.0', 'v3.1.0', 'v3.1.2', 'v3.1.3'];
            for (const tag of requiredReleaseTags) {
              const { data: release } = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              const version = tag.slice(1);
              const names = new Set(release.assets.map(asset => asset.name));
              for (const suffix of ['update.bin', 'full-wipe.bin']) {
                if (!names.has(`meshink-${version}-${suffix}`)) {
                  throw new Error(`Published release ${tag} is missing ${suffix}; aborting cleanup.`);
                }
              }
              console.log(`Protected GitHub Release ${tag}: firmware downloads verified.`);
            }
            const cutoff = Date.now() - 48 * 60 * 60 * 1000;
            const targetPaths = new Set([
              '.github/workflows/t5-ui-binary.yml',
              '.github/workflows/t5-binary.yml'
            ]);
            const allArtifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100}
            );
            const oldArtifacts = allArtifacts.filter(a =>
              !a.expired && a.workflow_run?.id && Date.parse(a.created_at) < cutoff
            );
            const runIds = [...new Set(oldArtifacts.map(a => a.workflow_run.id))];
            const runPaths = new Map();
            async function parallel(items, maximum, fn) {
              let nextIndex = 0;
              await Promise.all(Array.from({length: Math.min(maximum, items.length)}, async () => {
                while (nextIndex < items.length) {
                  const current = nextIndex++;
                  await fn(items[current]);
                }
              }));
            }
            await parallel(runIds, 8, async runId => {
              const {data} = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId
              });
              runPaths.set(runId, data.path);
            });
            const targets = oldArtifacts.filter(a =>
              targetPaths.has(runPaths.get(a.workflow_run.id))
            );
            const proposedBytes = targets.reduce((sum, a) => sum + (a.size_in_bytes || 0), 0);
            console.log(`Found ${allArtifacts.length} total artifacts, ${targets.length} eligible old regular firmware build artifacts (${proposedBytes} bytes).`);
            let deleted = 0, deletedBytes = 0;
            const failures = [];
            await parallel(targets, 5, async artifact => {
              try {
                await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
                deleted++;
                deletedBytes += artifact.size_in_bytes || 0;
                if (deleted % 25 === 0) console.log(`Deleted ${deleted}/${targets.length} old regular firmware artifacts.`);
              } catch (error) {
                failures.push(`${artifact.id}: ${error.message}`);
                console.log(`Failed to delete artifact ${artifact.id}: ${error.message}`);
              }
            });
            console.log(`CLEANUP RESULT: deleted=${deleted}; bytes=${deletedBytes}; total_targeted=${targets.length}; failures=${failures.length}; all_artifacts=${allArtifacts.length}`);
            if (failures.length) core.setFailed(`Incomplete artifact cleanup: ${failures.length} failures; ${failures.slice(0,4).join('; ')}`);
