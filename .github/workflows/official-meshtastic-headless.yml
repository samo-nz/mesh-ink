name: Official Meshtastic Headless H752-01 Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/official-meshtastic
    paths:
      - tools/official_meshtastic/**
      - .github/workflows/official-meshtastic-headless.yml

# Only the most recent revision needs a full ~10-minute upstream build.
# Scope cancellations to this workflow and branch so other MeshInk CI is unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Core 6.2.0 expects SCons 4.11.1, but the pinned PIOArduino
      # platform requires tool-scons 4.8.1 and removes the newer package
      # during ESP-IDF configuration (SCons.Tool.FortranCommon import error).
      # Keep this experiment reproducible until the platform fixes the mismatch.
      - name: Install compatible PlatformIO Core
        run: |
          python -m pip install "platformio==6.1.19"
          pio --version
          # PIOArduino creates a *second* Python environment at ~/.platformio/penv
          # for its hybrid ESP-IDF -> Arduino build. Its unconstrained uv install
          # otherwise selects pioarduino 6.2.0, replacing SCons 4.8.1 with 4.11.1
          # between build phases (SCons.Tool.FortranCommon import failure).
          printf '%s\n' 'pioarduino==6.1.19' > "$RUNNER_TEMP/meshink-uv-constraints.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/meshink-uv-constraints.txt" >> "$GITHUB_ENV"
      - name: Test safe headless preparation and power telemetry guards
        run: python -m unittest discover -s tools/official_meshtastic -p 'test_*.py' -v
      - name: Fetch pinned official Meshtastic 2.8.1
        run: git clone --depth 1 --branch v2.8.1.8e6a88d https://github.com/meshtastic/firmware.git official-meshtastic
      - name: Prepare screenless H752-01
        run: python tools/official_meshtastic/prepare_headless.py official-meshtastic
      - name: Build official protocol runtime
        working-directory: official-meshtastic
        run: pio run -e meshink-h752-headless
      - name: Measure binary size against MeshInk OTA app slot
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          build = Path("official-meshtastic/.pio/build/meshink-h752-headless")
          # Official platformio-custom.py uses a versioned PROGNAME, not firmware.bin.
          candidates = sorted(build.glob("firmware-*.bin"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one versioned application binary; found {candidates}")
          p = candidates[0]
          n = p.stat().st_size
          print("headless_official_binary=", p)
          print("headless_official_binary_bytes=", n)
          print("fits_meshink_6MiB_OTA_slot=", n <= 0x600000)
          if n > 0x600000:
              raise SystemExit("Standalone headless runtime exceeds MeshInk's 6MiB OTA app slot")
          PY
