[platformio]
default_envs = t5-pro
boards_dir = boards

[env:t5-pro]
platform = espressif32@6.10.0
board = T5-ePaper-S3
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DESP32
    -DLORA_FREQ=917.375
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=22
    -DP_LORA_NSS=46
    -DP_LORA_DIO_1=10
    -DP_LORA_RESET=1
    -DP_LORA_BUSY=47
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -Isrc/board
    -Iinclude
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit BusIO
    file://lib/MeshCore/lib/ed25519

[env:t5-companion]
extends = env:t5-pro
build_flags =
    ${env:t5-pro.build_flags}
    -DBUILD_EXAMPLE=companion_radio
    -DT5_DIAGNOSTICS=1
    -DT5_FIRMWARE_VERSION='"0.9.4"'
    -DBLE_PIN_CODE=123456
    -DBLE_NAME_PREFIX='"MeshCore-"'
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DP_LORA_SCLK=14
    -DP_LORA_MISO=21
    -DP_LORA_MOSI=13
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DPIN_BOARD_SDA=39
    -DPIN_BOARD_SCL=40
    -DENV_INCLUDE_GPS=1
    -DENV_SKIP_GPS_DETECT=1
    -DGPS_BAUD_RATE=9600
    -DPIN_GPS_TX=44
    -DPIN_GPS_RX=43
    -DMAX_CONTACTS=50
    -DMAX_GROUP_CHANNELS=8
    -DOFFLINE_QUEUE_SIZE=32
    -Ilib/MeshCore/examples/companion_radio
build_src_filter =
    -<*>
    +<board/target.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    stevemarple/MicroNMEA
    densaugeo/base64
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d

[env:t5-diagnostic]
extends = env:t5-pro
build_src_filter =
    -<*>
    +<diagnostic.cpp>

[env:t5-ui-onboarding]
extends = env:t5-pro
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_UI_VERSION='"0.9.4"'
build_src_filter =
    -<*>
    +<ui_onboarding.cpp>
    +<ui_standalone_main.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d

[env:t5-unified]
extends = env:t5-pro
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_DIAGNOSTICS=1
    -DT5_FIRMWARE_VERSION='"0.9.4"'
    -DBLE_PIN_CODE=123456
    -DBLE_NAME_PREFIX='"MeshCore-"'
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DP_LORA_SCLK=14
    -DP_LORA_MISO=21
    -DP_LORA_MOSI=13
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DPIN_BOARD_SDA=39
    -DPIN_BOARD_SCL=40
    -DENV_INCLUDE_GPS=1
    -DENV_SKIP_GPS_DETECT=1
    -DGPS_BAUD_RATE=9600
    -DPIN_GPS_TX=44
    -DPIN_GPS_RX=43
    -DMAX_CONTACTS=50
    -DMAX_GROUP_CHANNELS=8
    -DOFFLINE_QUEUE_SIZE=32
    -Ilib/MeshCore/examples/companion_radio
build_src_filter =
    -<*>
    +<board/target.cpp>
    +<companion_runtime.cpp>
    +<local_mesh_runtime.cpp>
    +<ui_onboarding.cpp>
    +<unified_main.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    stevemarple/MicroNMEA
    densaugeo/base64
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d
