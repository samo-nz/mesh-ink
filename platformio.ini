[platformio]
default_envs = t5-pro
boards_dir = boards

; Shared Crypto provider seam. Protocol cores consume the common Arduino Crypto
; API; they do not select the implementation themselves.
[meshink-crypto-meshtastic]
lib_deps =
    Crypto=https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip

; MeshCore's original upstream provider, retained as a recovery/fallback.
[meshink-crypto-meshcore]
lib_deps =
    rweather/Crypto @ ^0.4.0

; Active provider selector. While Leaf is enabled this points at the
; Meshtastic fork. If Leaf is removed/replaced and no longer needs XEdDSA,
; switch this single line to ${meshink-crypto-meshcore.lib_deps}.
[meshink-crypto]
lib_deps =
    ${meshink-crypto-meshtastic.lib_deps}

[env:t5-pro]
platform = espressif32@6.10.0
board = T5-ePaper-S3
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DESP32
    -DLORA_FREQ=917.375
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=22
    -DP_LORA_NSS=46
    -DP_LORA_DIO_1=10
    -DP_LORA_RESET=1
    -DP_LORA_BUSY=47
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -Isrc/board
    -Iinclude
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit BusIO
    file://lib/MeshCore/lib/ed25519

[env:t5-diagnostic]
extends = env:t5-pro
build_src_filter =
    -<*>
    +<diagnostic.cpp>

[env:t5-ui-onboarding]
extends = env:t5-pro
extra_scripts =
    pre:tools/generate_logo.py
    pre:tools/patch_epdiy_shared_gpio_isr.py
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_UI_VERSION='"2.1.1-test.13"'
build_src_filter =
    -<*>
    +<board/t5_power_backend.cpp>
    +<board/t5_buttons_backend.cpp>
    +<ui_onboarding.cpp>
    +<ui_standalone_main.cpp>
    +<protocol/mesh_protocol.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d

[env:t5-unified]
extends = env:t5-pro
; Crypto implementation is selected centrally by [meshink-crypto].
; MeshCore and protocol helpers must not select their own provider here.
extra_scripts =
    pre:tools/select_crypto_provider.py
    pre:tools/generate_logo.py
    pre:tools/patch_epdiy_shared_gpio_isr.py
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_DIAGNOSTICS=0
    -DMESHINK_PROTOCOL_SLOT_1_ENABLED=1
    -DMESHINK_PROTOCOL_SLOT_2_ENABLED=1
    -DMESHINK_DEVICE_SERVICES_ENABLED=1
    ; Deep-sleep standby experiment branched from MeshInk 2.0.0.
    ; For temporary verbose testing, set T5_DIAGNOSTICS=1 or add one targeted flag:
    ; -DT5_LOG_GPS=1 / -DT5_LOG_UI=1 / -DT5_LOG_MESH=1 /
    ; -DT5_LOG_MAP=1 / -DT5_LOG_BOARD=1
    -DT5_FIRMWARE_VERSION='"2.1.1-test.13"'
    -DBLE_PIN_CODE=123456
    -DBLE_NAME_PREFIX='"MeshCore-"'
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DP_LORA_SCLK=14
    -DP_LORA_MISO=21
    -DP_LORA_MOSI=13
    ; H752-01 hardware post-init follows LilyGO's sequence in target.cpp:
    ; RadioLib begin() default TCXO drive, then setTCXO(2.4), then DIO2 RF switch.
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DPIN_BOARD_SDA=39
    -DPIN_BOARD_SCL=40
    -DENV_INCLUDE_GPS=1
    -DENV_SKIP_GPS_DETECT=1
    -DGPS_BAUD_RATE=9600
    -DPIN_GPS_TX=44
    -DPIN_GPS_RX=43
    -DMAX_CONTACTS=50
    -DMAX_GROUP_CHANNELS=8
    -DOFFLINE_QUEUE_SIZE=32
    -Ilib/MeshCore/examples/companion_radio
build_src_filter =
    -<*>
    +<board/target.cpp>
    +<board/t5_power_backend.cpp>
    +<board/t5_buttons_backend.cpp>
    +<board/t5_radio_backend.cpp>
    +<board/t5_storage_backend.cpp>
    +<companion_runtime.cpp>
    +<local_mesh_runtime.cpp>
    +<protocol/mesh_protocol.cpp>
    +<protocol/meshcore_protocol.cpp>
    +<protocol/meshtastic_protocol.cpp>
    +<message_store.cpp>
    +<backup_restore.cpp>
    +<map_tiles.cpp>
    +<pmtiles_reader.cpp>
    +<ui_onboarding.cpp>
    +<unified_main.cpp>
    +<cache64_compat.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    stevemarple/MicroNMEA
    densaugeo/base64
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d
    https://github.com/bitbank2/PNGdec.git#b862a89409962366fd704ed0445b983a710f034c
    https://github.com/Meshtastic-Solutions/libmeshtastic-leaf.git#bd542d6e77aa7b9507dcc8d153f6dad0c35a8c17
    ${meshink-crypto.lib_deps}

[env:t5-unified-cache64]
extends = env:t5-unified
framework = arduino, espidf
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.cache64"
build_flags =
    ${env:t5-unified.build_flags}
    -DT5_CACHE64_EXPERIMENT=1
    -Icache64_include
    -w
    -Wno-error=class-memaccess
    -Wno-error=misleading-indentation
    -Wno-error=format-truncation

; RC audit build: expose warnings hidden by the production cache64 build while
; preserving the same source/configuration. This is CI-only and not packaged.
[env:t5-unified-cache64-warnings]
extends = env:t5-unified-cache64
; Keep dependencies/frameworks on the exact production flags (including -w).
; Re-enable warnings only for MeshInk project sources. The CI parser below the
; build rejects any warning whose diagnostic originates in MeshInk-owned code.
build_src_flags =
    -Wall
    -Wextra

; Generic portability regression profile. It deliberately removes live GNSS
; capability while retaining the field-tested H752-01/V2 electrical path.
; This is not a firmware target for any alternate board.
[env:t5-unified-cache64-nogps-test]
extends = env:t5-unified-cache64
build_flags =
    ${env:t5-unified-cache64.build_flags}
    -DT5_UI_HAS_GPS=0
