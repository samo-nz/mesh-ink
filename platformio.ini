[platformio]
default_envs = t5-pro
boards_dir = boards

; Shared Crypto provider seam. Protocol cores consume the common Arduino Crypto
; API; they do not select the implementation themselves.
[meshink-crypto-meshtastic]
lib_deps =
    Crypto=https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip

; MeshCore's original upstream provider, retained as a recovery/fallback.
[meshink-crypto-meshcore]
lib_deps =
    rweather/Crypto @ ^0.4.0

; Shared Meshtastic Crypto stays selected for official XEdDSA/Curve25519;
; deleting Leaf does NOT change the crypto provider.
[meshink-crypto]
lib_deps =
    ${meshink-crypto-meshtastic.lib_deps}

[env:t5-pro]
platform = espressif32@6.10.0
board = T5-ePaper-S3
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DESP32
    -DLORA_FREQ=917.375
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=22
    -DP_LORA_NSS=46
    -DP_LORA_DIO_1=10
    -DP_LORA_RESET=1
    -DP_LORA_BUSY=47
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -Isrc/board
    -Iinclude
    ; Upstream Meshtastic generated protobuf headers import meshtastic/*.pb.h,
    ; and PhoneAPI refers to its mesh headers as local upstream includes.
    -Ilib/Meshtastic/src
    -Ilib/Meshtastic/src/mesh
    -Ilib/Meshtastic/src/mesh/generated
    -Ilib/Meshtastic/src/platform/esp32
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit BusIO
    file://lib/MeshCore/lib/ed25519

[env:t5-diagnostic]
extends = env:t5-pro
build_src_filter =
    -<*>
    +<diagnostic.cpp>

[env:t5-ui-onboarding]
extends = env:t5-pro
extra_scripts =
    pre:tools/generate_logo.py
    pre:tools/patch_epdiy_shared_gpio_isr.py
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_UI_VERSION='"2.1.1-test.29"'
build_src_filter =
    -<*>
    +<board/t5_power_backend.cpp>
    +<board/t5_buttons_backend.cpp>
    +<ui_onboarding.cpp>
    +<ui_standalone_main.cpp>
    +<protocol/mesh_protocol.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d

[env:t5-unified]
extends = env:t5-pro
; Meshtastic upstream uses C++14 digit separators and C++17 std::optional.
; Keep the selected MeshInk application and both official cores on one ABI.
build_unflags =
    -std=gnu++11
    -std=c++11
; Crypto implementation is selected centrally by [meshink-crypto].
; MeshCore and protocol helpers must not select their own provider here.
extra_scripts =
    pre:tools/prepare_meshtastic_library.py
    pre:tools/select_crypto_provider.py
    pre:tools/generate_logo.py
    pre:tools/patch_epdiy_shared_gpio_isr.py
build_flags =
    ${env:t5-pro.build_flags}
    -DT5_DIAGNOSTICS=0
    -DMESHINK_PROTOCOL_SLOT_1_ENABLED=1
    -DMESHINK_PROTOCOL_SLOT_2_ENABLED=1
    -DMESHINK_DEVICE_SERVICES_ENABLED=1
    -std=gnu++17
    ; Official Meshtastic is headless and receives all board information
    ; through MeshInk adapters, never a copied Seeed/T5 board variant.
    -Iinclude/meshtastic_compat
    -DAPP_VERSION='"2.8.1.8e6a88d"'
    -DARCH_ESP32=1
    -DMESHTASTIC_EXCLUDE_POWER_FSM=1
    -DMESHINK_MESHTASTIC_EXTERNAL_UI=1
    ; Temporary first-hardware-test instrumentation: change to 0 to silence it.
    -DMESHINK_MESHTASTIC_HW_TEST_LOG=1
    ; Temporary acquisition diagnostics shared by both protocol selections.
    -DT5_GPS_ACQUISITION_DIAG=1
    ; Keep physical GNSS excluded, but include official position networking.
    -DMESHTASTIC_EXCLUDE_GPS=1
    -DMESHINK_MESHTASTIC_EXTERNAL_POSITION=1
    ; MeshInk owns the physical BLE, WiFi, serial and I2C peripherals.
    -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
    -DMESHTASTIC_EXCLUDE_WIFI=1
    -DMESHTASTIC_EXCLUDE_I2C=1
    -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
    -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    -DMESHTASTIC_EXCLUDE_MQTT=1
    ; MeshInk owns input, hardware telemetry, serial IO and display. Retain
    ; official admin, crypto/PKI, routing, text and node network modules.
    -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
    -DMESHTASTIC_EXCLUDE_REPLYBOT=1
    -DMESHTASTIC_EXCLUDE_ATAK=1
    -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
    -DMESHTASTIC_EXCLUDE_BEACON=1
    -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
    -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
    -DMESHTASTIC_EXCLUDE_WAYPOINT=1
    -DMESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1
    -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
    -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
    -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
    -DMESHTASTIC_EXCLUDE_SERIAL=1
    -DMESHTASTIC_EXCLUDE_DROPZONE=1
    -DHAS_TRAFFIC_MANAGEMENT=0
    -DHAS_VARIABLE_HOPS=0
    -DUSE_THREAD_NAMES
    ; Deep-sleep standby experiment branched from MeshInk 2.0.0.
    ; For temporary verbose testing, set T5_DIAGNOSTICS=1 or add one targeted flag:
    ; -DT5_LOG_GPS=1 / -DT5_LOG_UI=1 / -DT5_LOG_MESH=1 /
    ; -DT5_LOG_MAP=1 / -DT5_LOG_BOARD=1
    -DT5_FIRMWARE_VERSION='"2.1.1-test.29"'
    -DBLE_PIN_CODE=123456
    -DBLE_NAME_PREFIX='"MeshCore-"'
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DP_LORA_SCLK=14
    -DP_LORA_MISO=21
    -DP_LORA_MOSI=13
    ; H752-01 hardware post-init follows LilyGO's sequence in target.cpp:
    ; RadioLib begin() default TCXO drive, then setTCXO(2.4), then DIO2 RF switch.
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DPIN_BOARD_SDA=39
    -DPIN_BOARD_SCL=40
    -DENV_INCLUDE_GPS=1
    -DENV_SKIP_GPS_DETECT=1
    -DGPS_BAUD_RATE=9600
    -DPIN_GPS_TX=44
    -DPIN_GPS_RX=43
    -DMAX_CONTACTS=50
    -DMAX_GROUP_CHANNELS=8
    -DOFFLINE_QUEUE_SIZE=32
    -Ilib/MeshCore/examples/companion_radio
build_src_filter =
    -<*>
    +<board/target.cpp>
    +<board/t5_power_backend.cpp>
    +<board/t5_buttons_backend.cpp>
    +<board/t5_radio_backend.cpp>
    +<board/t5_storage_backend.cpp>
    +<companion_runtime.cpp>
    +<local_mesh_runtime.cpp>
    +<protocol/mesh_protocol.cpp>
    +<protocol/meshcore_protocol.cpp>
    +<protocol/meshtastic_protocol.cpp>
    +<protocol/meshtastic_ui_data.cpp>
    +<protocol/meshtastic_official_phoneapi.cpp>
    +<protocol/meshtastic_radio.cpp>
    +<protocol/meshtastic_runtime.cpp>
    +<protocol/meshtastic_worker.cpp>
    ; Headless platform glue and explicit upstream template instantiation
    ; are included from already-selected radio/runtime translation units.
    +<message_store.cpp>
    +<backup_restore.cpp>
    +<device_settings_snapshot.cpp>
    +<map_tiles.cpp>
    +<pmtiles_reader.cpp>
    +<ui_onboarding.cpp>
    +<unified_main.cpp>
    +<cache64_compat.cpp>
lib_deps =
    ${env:t5-pro.lib_deps}
    stevemarple/MicroNMEA
    densaugeo/base64
    https://github.com/vroland/epdiy.git#403ba3b8c6cf191cea8026b764221f2dde55b653
    https://github.com/richgel999/miniz.git#77d0dce8627735138c51770d1799a1ef48f2117d
    https://github.com/bitbank2/PNGdec.git#b862a89409962366fd704ed0445b983a710f034c
    ${meshink-crypto.lib_deps}
    https://github.com/Erriez/ErriezCRC32/archive/refs/tags/1.0.1.zip
    https://github.com/nanopb/nanopb/archive/0.4.92.zip
    ; Same lightweight scheduler used by official Meshtastic.
    https://github.com/meshtastic/ArduinoThread/archive/b841b0415721f1341ea41cccfb4adccfaf951567.zip
    ; Meshtastic's upstream main.h includes Screen.h even in headless mode.
    ; Its OLEDDisplay enum type is needed by header declarations, not by
    ; MeshInk's e-paper UI. The screen implementation is not compiled.
    https://github.com/meshtastic/esp8266-oled-ssd1306/archive/bb93fd40685f22e850330ea162f1dd154a4e0685.zip

[env:t5-unified-cache64]
extends = env:t5-unified
framework = arduino, espidf
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.cache64"
build_flags =
    ${env:t5-unified.build_flags}
    -DT5_CACHE64_EXPERIMENT=1
    -Icache64_include
    -w
    -Wno-error=class-memaccess
    -Wno-error=misleading-indentation
    -Wno-error=format-truncation

; RC audit build: expose warnings hidden by the production cache64 build while
; preserving the same source/configuration. This is CI-only and not packaged.
[env:t5-unified-cache64-warnings]
extends = env:t5-unified-cache64
; Keep dependencies/frameworks on the exact production flags (including -w).
; Re-enable warnings only for MeshInk project sources. The CI parser below the
; build rejects any warning whose diagnostic originates in MeshInk-owned code.
build_src_flags =
    -Wall
    -Wextra

; Generic portability regression profile. It deliberately removes live GNSS
; capability while retaining the field-tested H752-01/V2 electrical path.
; This is not a firmware target for any alternate board.
[env:t5-unified-cache64-nogps-test]
extends = env:t5-unified-cache64
build_flags =
    ${env:t5-unified-cache64.build_flags}
    -DT5_UI_HAS_GPS=0
